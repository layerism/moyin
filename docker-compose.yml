services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      STORAGE_ROOT: /app/storage
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
