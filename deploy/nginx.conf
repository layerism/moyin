# Production HTTP configuration on public port 8888.
# The root is a stable symlink to this repository's frontend/dist.

server {
    listen 80;
    server_name ainami.tech www.ainami.tech;

    # 将所有 HTTP 请求强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ainami.tech www.ainami.tech;
    client_max_body_size 100m;

    # SSL 证书路径
    ssl_certificate /etc/nginx/cert/ainami.tech.pem;
    ssl_certificate_key /etc/nginx/cert/ainami.tech.key;

    # 推荐的 SSL 基础安全参数
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    
    # 网站根目录及路由配置
    root "/var/www/moyin/v1";
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
}
