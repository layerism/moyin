# Shared HTTP configuration: load once for both versions.
# Point both domains to this server and publish each frontend to its own root.
# Configure HTTPS with Certbot after both HTTP sites are reachable.
# Do not overwrite a live Certbot-managed configuration with this HTTP file.

# Production: ainami.tech -> prod frontend + backend 8000.
server {
    listen 80;
    server_name ainami.tech;
    client_max_body_size 100m;

    root "/var/www/moyin/prod";
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Gray release: gray.ainami.tech -> gray frontend + backend 8001.
server {
    listen 80;
    server_name gray.ainami.tech;
    client_max_body_size 100m;

    root "/var/www/moyin/gray";
