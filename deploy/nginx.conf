# Shared HTTP configuration on public port 8888.
# Each root is a stable symlink to that environment's repository frontend/dist.
# All three environments share one port; Nginx selects the site by Host.

# Production: ainami.tech -> prod frontend + backend 8000.
server {
    listen 8888;
    server_name ainami.tech;
    client_max_body_size 100m;

    root "/var/www/moyin/prod";
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

