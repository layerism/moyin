<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单行预览工具栏原型</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#edf1f7;color:#25334b;font:14px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;background:white;border:1px solid #dbe3ef;border-radius:12px;overflow:hidden}header{padding:16px 20px;display:flex;justify-content:space-between;gap:16px}header small{color:#8190a6}.bar{display:flex;align-items:center;gap:10px;padding:5px 10px;min-height:38px;border-block:1px solid #e1e7f0;background:#f8fafc;white-space:nowrap;overflow-x:auto}button,select{font:12px/1.4 system-ui,sans-serif;color:inherit;border:1px solid #d7dfec;background:white;border-radius:5px;height:26px;padding:0 7px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.seg{display:flex;padding:0;background:#edf1f6;border:1px solid #dce3ed;border-radius:5px;gap:0}.seg button{border:0;background:transparent;height:24px;padding:0 10px;color:#60708a}.seg button[aria-pressed=true]{background:white;color:#2467e8;box-shadow:none}.group{display:flex;align-items:center;gap:6px}.group span{font-size:12px;min-width:44px;text-align:center}.zoom{gap:0;border:1px solid #d7dfec;border-radius:5px;background:white;overflow:hidden}.zoom button{border:0;border-radius:0;height:24px;min-width:26px;background:transparent}.zoom #scale{border-inline:1px solid #e8edf4;min-width:44px;font-variant-numeric:tabular-nums}button:hover{background:#edf4ff}button:focus-visible,select:focus-visible{outline:2px solid #91b6ff;outline-offset:1px}#size{width:54px;border-color:transparent;background:transparent}#paper-controls{gap:7px;padding-right:10px;border-right:1px solid #dde4ee}#paper-controls span{color:#718098;min-width:auto}.viewport{height:570px;overflow:auto;background:#e7ecf3;padding:20px;overscroll-behavior:contain}.paper{width:100%;min-height:670px;background:white;box-shadow:0 2px 8px #2233441a;margin:auto;padding:70px 32px;text-align:center;transform-origin:top center}.paper h1{font-size:27px;margin:35px 0 10px}.paper h2{font-size:19px;font-weight:500;margin-top:40px}.paper p{margin-top:80px;color:#63718a}.note{max-width:760px;margin:14px auto;color:#7f8ca0;font-size:12px}[hidden]{display:none!important}@media(max-width:540px){body{padding:12px}.bar{gap:8px;padding:5px 8px}.seg button{padding:0 9px}header{flex-wrap:wrap}.paper{padding:40px 16px}}
</style><main><header><strong>毕业论文.docx</strong><small>交互原型 · 示例文档</small></header><div class="bar"><div class="seg" role="group" aria-label="预览格式"><button data-mode="docx" aria-pressed="false">DOCX</button><button data-mode="pdf" aria-pressed="true">PDF</button></div><div class="group" id="pages"><button id="prev" aria-label="上一页">‹</button><span id="count">2 / 22</span><button id="next" aria-label="下一页">›</button></div><div class="group" id="paper-controls" hidden><select id="size" aria-label="纸张"><option>A4</option><option>A3</option></select><span title="按浏览器排版推断，可能与 Word 页数不同">14 页</span></div><div class="group zoom"><button id="minus" aria-label="缩小">−</button><button id="scale" title="恢复默认缩放">100%</button><button id="plus" aria-label="放大">＋</button></div></div><div class="viewport"><article class="paper" id="paper"><small id="mode-label">PDF 转换预览 · 示例</small><h1>本科毕业论文（设计）</h1><h2>AI 智能云盘的设计与实现</h2><p>此处仅为排版示意，不代表实际文件转换效果。</p><p id="page-label">第 2 页</p></article></div></main><p class="note">点击 DOCX / PDF 切换工具，试用翻页、纸张与缩放。正式界面保留原有预览功能，采用紧凑分组布局，缩放紧接页数。</p><script>
const $=id=>document.getElementById(id);let mode='docx',page=2,zoom=50;function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('pages').hidden=mode!=='pdf';$('paper-controls').hidden=mode!=='docx';$('count').textContent=page+' / 22';$('prev').disabled=page===1;$('next').disabled=page===22;$('scale').textContent=zoom+'%';$('paper').style.width=zoom+'%';$('paper').style.minWidth=zoom+'%';$('mode-label').textContent=(mode==='pdf'?'PDF 转换预览':'DOCX 预览 · '+$('size').value)+' · 示例';$('page-label').textContent='第 '+page+' 页';$('minus').disabled=zoom<=50;$('plus').disabled=zoom>=150}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('prev').onclick=()=>{page=Math.max(1,page-1);render()};$('next').onclick=()=>{page=Math.min(22,page+1);render()};$('minus').onclick=()=>{zoom=Math.max(50,zoom-10);render()};$('plus').onclick=()=>{zoom=Math.min(150,zoom+10);render()};$('scale').onclick=()=>{zoom=100;render()};$('size').onchange=render;render();
</script></html>
