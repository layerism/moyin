<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>审核测试 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef6;color:#19243a;font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:32px 16px}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d6dfed;border-radius:7px;padding:8px 16px;background:white;color:inherit}button:hover{background:#f1f6ff}main{max-width:780px;margin:auto;background:white;border:1px solid #dce3ee;border-radius:16px;box-shadow:0 20px 70px #23355420;overflow:hidden}header{padding:20px 24px;border-bottom:1px solid #e8edf4;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}header p{margin:3px 0 0;color:#6b7890;font-size:13px}.badge{font-size:12px;color:#6b7890;background:#f2f5fa;border-radius:5px;padding:4px 8px}.body{padding:20px 24px;max-height:70vh;overflow:auto}.row{display:flex;align-items:center;gap:16px;margin-bottom:16px}.row label{font-weight:600;white-space:nowrap}select{flex:1;border:1px solid #d6dfed;border-radius:7px;background:white;padding:9px 12px;min-width:0}label.title{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:8px}label.title span{font-weight:400;color:#8490a4;font-size:12px}textarea{resize:vertical;width:100%;min-height:120px;border:1px solid #d6dfed;border-radius:8px;padding:12px;color:#26354d;outline:none}textarea:focus,select:focus{border-color:#2870ef;outline:2px solid #e6efff}.preset{display:flex;flex-wrap:wrap;gap:6px 16px;color:#748099;font-size:12px;margin:10px 0 20px}.preset b{font-weight:500;color:#52627d}.upload{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px dashed #a8bee3;border-radius:8px;background:#f9fbff}.upload strong{font-weight:500}.upload small{display:block;color:#8591a5;font-size:12px;margin-top:2px}.file{display:flex;justify-content:space-between;align-items:center;margin-top:8px;background:#f5f7fa;padding:8px 12px;border-radius:6px}.file button{border:0;padding:2px 8px;background:transparent}footer{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #e8edf4;background:#fcfdff;gap:16px}footer small{color:#8490a4;font-size:12px}.primary{background:#2868ef;color:white;border-color:#2868ef}.primary:hover{background:#1858dc}.primary:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:8px;margin-top:20px;border-bottom:1px solid #e6ebf3;padding-bottom:8px}.tabs button{border:0;background:transparent;color:#6d7b91}.tabs button.active{background:#edf3ff;color:#2364ec}.result pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;padding:14px;border-radius:8px;font:12px/1.7 ui-monospace,monospace}.result p{font-size:12px;color:#7b889c;margin:8px 0}.notice{text-align:center;color:#708099;font-size:12px;margin:16px auto} [hidden]{display:none!important}@media(max-width:540px){body{padding:12px}header,.body,footer{padding:16px}.row{gap:10px}.upload{align-items:flex-start}footer small{max-width:55%}}
</style>
<main><header><div><h1>审核测试</h1><p>DOCX 完成性审核</p></div><span class="badge">交互原型 · 示例数据</span></header>
<div class="body"><div class="row"><label for="model">审核模型</label><select id="model"><option value="">请选择模型</option><option value="example">文档审核模型（示例）</option></select></div>
<label class="title" for="prompt">审核要求 <span>User prompt · 仅用于本次测试</span></label><textarea id="prompt">请检查文档是否按照要求完整填写，指出缺失内容及修改建议。</textarea>
<div class="preset"><b>脚本预设</b><span>温度 0</span><span>超时 60 秒</span><span>最大输入 220,000 字符</span></div>
<div class="upload"><div><strong>上传测试文档</strong><small>DOCX · 单文件不超过 50 MB</small></div><button id="pick">选择文件</button><input id="file" type="file" accept=".docx" hidden></div><div id="selected" class="file" hidden><span id="filename"></span><button id="remove" aria-label="移除文件">×</button></div>
<section class="result" id="result" hidden><div class="tabs"><button class="active" data-tab="messages">请求 messages</button><button data-tab="json">结果 JSON</button></div><p>模拟结果，仅演示布局；未上传文件、未调用模型。</p><pre id="output"></pre></section></div>
<footer><small>测试不写入学生流程，使用脚本预设配置。</small><button class="primary" id="run" disabled>模拟测试</button></footer></main><p class="notice">可选择模型、编辑审核要求、选择文件并切换结果标签。所有操作仅在本页演示。</p>
<script>
const $=id=>document.getElementById(id);let selected=null,tab='messages';let snapshot='';const update=()=>{$('run').disabled=!selected||!$('model').value||!$('prompt').value.trim()};const reset=()=>{$('result').hidden=true;update()};$('pick').onclick=()=>$('file').click();$('file').onchange=()=>{selected=$('file').files[0]||null;$('filename').textContent=selected?.name||'';$('selected').hidden=!selected;reset()};$('remove').onclick=()=>{selected=null;$('file').value='';$('selected').hidden=true;reset()};$('model').onchange=reset;$('prompt').oninput=reset;function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('output').textContent=JSON.stringify(tab==='messages'?[{role:'system',content:'（示例）系统审核规则及固定输出协议。'},{role:'user',content:snapshot+'\n（示例文档内容）'}]:{passed:false,reason:'示例：请补充文档中的实习日期。',details:{issues:[{target:'实习日期',correction:'请填写完整起止日期。'}]}},null,2)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('run').onclick=()=>{snapshot=$('prompt').value;tab='json';render();$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'nearest'})};
</script></html>
